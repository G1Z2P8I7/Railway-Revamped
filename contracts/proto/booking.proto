syntax = "proto3";

package railway.revamped.v1;

option go_package = "github.com/railway-revamped/core/pkg/proto/v1;railwayv1";

service BookingService {
  rpc SearchAvailability (SearchAvailabilityRequest) returns (SearchAvailabilityResponse);
  rpc RequestSeatHold (RequestSeatHoldRequest) returns (RequestSeatHoldResponse);
  rpc ReleaseSeatHold (ReleaseSeatHoldRequest) returns (ReleaseSeatHoldResponse);
  rpc ConfirmBooking (ConfirmBookingRequest) returns (ConfirmBookingResponse);
  rpc GetPNRStatus (GetPNRStatusRequest) returns (GetPNRStatusResponse);
  rpc CancelTicket (CancelTicketRequest) returns (CancelTicketResponse);
}

message StationHop {
  string station_code = 1;
  int32 stop_index = 2;
  string arrival_time = 3;
  string departure_time = 4;
  int32 distance_km = 5;
}

message TrainAvailability {
  string train_number = 1;
  string train_name = 2;
  string run_date = 3;
  string class_code = 4;
  string quota_code = 5;
  int32 available_seats = 6;
  int32 rac_count = 7;
  int32 waitlist_count = 8;
  double base_fare = 9;
  double confirmation_probability = 10;
}

message SearchAvailabilityRequest {
  string origin_cluster_or_code = 1;
  string destination_cluster_or_code = 2;
  string travel_date = 3;
  string class_code = 4;
  string quota_code = 5;
}

message SearchAvailabilityResponse {
  repeated TrainAvailability trains = 1;
  int64 server_time_ms = 2;
}

message RequestSeatHoldRequest {
  string user_id = 1;
  string train_number = 2;
  string run_date = 3;
  string class_code = 4;
  string quota_code = 5;
  int32 origin_stop_index = 6;
  int32 dest_stop_index = 7;
  int32 passenger_count = 8;
  int32 lease_ttl_seconds = 9;
}

message RequestSeatHoldResponse {
  bool success = 1;
  string lease_token = 2;
  int64 expires_at_unix = 3;
  int32 remaining_inventory = 4;
  uint64 segment_bitmask = 5;
  string error_code = 6;
  string error_message = 7;
}

message ReleaseSeatHoldRequest {
  string user_id = 1;
  string train_number = 2;
  string run_date = 3;
  string lease_token = 4;
}

message ReleaseSeatHoldResponse {
  bool success = 1;
  string message = 2;
}

message PassengerInput {
  string full_name = 1;
  int32 age = 2;
  string gender = 3;
  string berth_preference = 4;
  bool is_senior_citizen = 5;
}

message ConfirmBookingRequest {
  string user_id = 1;
  string lease_token = 2;
  string payment_transaction_id = 3;
  repeated PassengerInput passengers = 4;
  bool enable_flexi_cancel = 5;
}

message AllocatedPassenger {
  string passenger_id = 1;
  string full_name = 2;
  string booking_status = 3; // CNF, RAC, WL
  string coach_id = 4;
  int32 berth_number = 5;
  string berth_type = 6; // LB, MB, UB, SL, SU
}

message ConfirmBookingResponse {
  bool success = 1;
  string pnr_number = 2;
  string status = 3;
  repeated AllocatedPassenger passengers = 4;
  string ed25519_signed_qr_payload = 5;
  string error_code = 6;
  string error_message = 7;
}

message GetPNRStatusRequest {
  string pnr_number = 1;
}

message GetPNRStatusResponse {
  string pnr_number = 1;
  string train_number = 2;
  string train_name = 3;
  string run_date = 4;
  string status = 5;
  repeated AllocatedPassenger passengers = 6;
  string charting_status = 7;
  double total_fare = 8;
  string ed25519_signed_qr_payload = 9;
}

message CancelTicketRequest {
  string user_id = 1;
  string pnr_number = 2;
  repeated string passenger_ids_to_cancel = 3; // empty for all
  string refund_preference = 4; // 'TRANSIT_LEDGER' or 'SOURCE_BANK'
}

message CancelTicketResponse {
  bool success = 1;
  double refund_amount = 2;
  double cancellation_fee = 3;
  string refund_channel = 4;
  string status = 5;
}
